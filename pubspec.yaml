  shelf_router: ^1.1.5
  shelf: ^1.4.3
  gal: ^2.3.3
  media_store_plus: ^0.1.3
  sqflite: ^2.4.5
  path: ^1.9.1
  open_file: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
