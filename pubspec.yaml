name: flick
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.4


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  wechat_assets_picker: ^10.1.3
  installed_apps: ^2.2.1
  bonsoir: ^6.0.1
  device_info_plus: ^13.3.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  mime: ^2.1.0
  dio: ^5.11.1
